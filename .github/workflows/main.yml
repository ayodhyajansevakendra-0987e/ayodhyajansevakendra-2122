
name: Build Ayodhya Jan Seva Kendra APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          cd janseva2/AyodhyaJanSevaKendra/android
          gradle assembleDebug
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        run: gradle -p janseva2/AyodhyaJanSevaKendra/android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ayodhya-Jan-Seva-Kendra-APK
          path: janseva2/AyodhyaJanSevaKendra/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
